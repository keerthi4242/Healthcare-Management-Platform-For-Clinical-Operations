server.port=8083

spring.application.name=API-GATEWAY

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/patients/**

spring.cloud.gateway.routes[1].id=health-service
spring.cloud.gateway.routes[1].uri=lb://HEALTH-TWIN-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/healthtwin/**

# FHIR Service
spring.cloud.gateway.routes[2].id=fhir-service
spring.cloud.gateway.routes[2].uri=lb://FHIR-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/fhir/**

# Vital Service
spring.cloud.gateway.routes[3].id=vital-service
spring.cloud.gateway.routes[3].uri=lb://VITAL-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/vitals/**

# Consent Service
spring.cloud.gateway.routes[4].id=consent-service
spring.cloud.gateway.routes[4].uri=lb://CONSENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/consents/**

# Auth Service
spring.cloud.gateway.routes[5].id=auth-service
spring.cloud.gateway.routes[5].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/auth/**

# Prediction Service
spring.cloud.gateway.routes[6].id=prediction-service
spring.cloud.gateway.routes[6].uri=lb://PREDICTION-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/predict/**
