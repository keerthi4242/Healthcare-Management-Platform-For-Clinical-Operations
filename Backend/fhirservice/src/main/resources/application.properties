spring.application.name=FHIR-SERVICE

server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.config.enabled=false
 
spring.data.mongodb.uri=mongodb://localhost:27017/fhirdb
 
eureka.instance.prefer-ip-address=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fhir-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.infosys.medisphere.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.infosys.medisphere.model.Vital