spring.application.name=HEALTH-TWIN-SERVICE
server.port=8082
spring.data.mongodb.uri=mongodb://localhost:27017/healthtwin

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=health-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.infosys.medisphere.model.Vital